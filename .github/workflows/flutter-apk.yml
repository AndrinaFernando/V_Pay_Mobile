name: VPay internal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'

      - name: Check Android toolchain
        run: |
          test -d "$ANDROID_HOME"
          java -version
          flutter --version
          flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build internal testing APK
        run: flutter build apk --release --dart-define=VPAY_API_BASE_URL=https://v-pay-backend.onrender.com

      - name: Upload internal testing APK
        uses: actions/upload-artifact@v7
        with:
          name: vpay-internal-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
